[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cosda"
version = "0.1.0"
description = "Counterfactual auditing of synthetic data for low-resource NLP."
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6",
  "tqdm>=4.66",
  "requests>=2.31",
  "huggingface_hub>=0.23,<1",
  "datasets>=3.0,<4",
]

[project.optional-dependencies]
aws = [
  "torch>=2.3",
  "transformers>=4.41",
  "accelerate>=0.30",
  "sentence-transformers>=3.0",
  "scikit-learn>=1.4",
  "evaluate>=0.4",
  "seqeval>=1.2",
  "rouge-score>=0.1",
  "sacrebleu>=2.4",
  "datasketch>=1.6",
  "peft>=0.11",
  "boto3>=1.34",
]

[project.scripts]
cosda = "cosda.cli:main"

[tool.setuptools.packages.find]
include = ["cosda*"]
