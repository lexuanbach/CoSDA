manifest_path: data/manifest/datasets.json
output_dir: runs
datasets: []
tasks: []
languages: []
budgets: [64]
multipliers: [3]
seeds: [13, 21, 34, 55, 89]
baselines: [gold_only, naive, random, quality_only, diversity_only, alpagasus_style, deita_style, less_style, cosda]
sample_per_class_when_possible: false

generation:
  backend: heuristic
  model: CohereLabs/aya-23-8B
  endpoint_url:
  api_key_env:
  temperature: 0.8
  top_p: 0.95
  max_new_tokens: 256
  candidates_per_seed: 3
  max_workers: 8
  request_timeout: 180
  request_retries: 3

judge:
  backend: disabled
  model: anthropic.claude-3-5-sonnet-20241022-v2:0
  endpoint_url:
  api_key_env:
  aws_region: us-east-1
  temperature: 0.0
  max_tokens: 512
  max_workers: 8
  request_timeout: 180
  request_retries: 3

audit:
  tau_l: 0.15
  tau_c: 0.60
  tau_h: 0.70
  alpha_u: 1.00
  alpha_c: 0.75
  alpha_d: 0.50
  alpha_l: 1.00
  alpha_h: 0.75
  ngram_n: 10
  minhash_n: 5
  minhash_threshold: 0.85
  embedding_leakage_threshold: 0.85
  embedder: hash
  embedding_dim: 768
  teacher: centroid
  neighbor_k: 5
