manifest_path: data/manifest/datasets.json
output_dir: /mnt/cosda/runs
datasets: ["masakhane/afrisenti"]
tasks: ["sentiment_classification"]
languages: ["swa"]
budgets: [8]
multipliers: [1]
seeds: [13]
baselines: [gold_only, naive, cosda]
sample_per_class_when_possible: false

generation:
  backend: openai_compatible
  model: Qwen/Qwen2.5-7B-Instruct
  endpoint_url: http://127.0.0.1:8000/v1/chat/completions
  temperature: 0.8
  top_p: 0.95
  max_new_tokens: 384
  candidates_per_seed: 1
  max_workers: 4
  request_timeout: 240
  request_retries: 3

judge:
  backend: openai_compatible
  model: Qwen/Qwen2.5-7B-Instruct
  endpoint_url: http://127.0.0.1:8000/v1/chat/completions
  temperature: 0.0
  max_tokens: 512
  max_workers: 2
  request_timeout: 180
  request_retries: 3

audit:
  tau_l: 0.15
  tau_c: 0.60
  tau_h: 0.70
  embedding_leakage_threshold: 0.85
  embedder: labse
  embedding_dim: 768
