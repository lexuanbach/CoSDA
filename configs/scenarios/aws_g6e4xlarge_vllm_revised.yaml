manifest_path: data/manifest/datasets.json
output_dir: /mnt/cosda/runs
datasets:
  - "masakhane/masakhanews"
  - "masakhane/afrisenti"
tasks:
  - news_topic_classification
  - sentiment_classification
languages: ["amh", "hau", "swa", "yor"]
budgets: [64]
multipliers: [3]
seeds: [13]
seed_sampling: balanced
sample_per_class_when_possible: false
baselines:
  - gold_only
  - naive
  - random
  - quality_only
  - diversity_only
  - alpagasus_style
  - deita_style
  - less_style
  - cosda_hard
  - cosda_relaxed
  - cosda_soft
  - cosda_equal_budget

generation:
  backend: openai_compatible
  model: Qwen/Qwen2.5-14B-Instruct
  endpoint_url: http://127.0.0.1:8000/v1/chat/completions
  temperature: 0.8
  top_p: 0.95
  max_new_tokens: 768
  candidates_per_seed: 3
  max_workers: 8
  request_timeout: 240
  request_retries: 3

judge:
  backend: openai_compatible
  model: Qwen/Qwen2.5-32B-Instruct-AWQ
  endpoint_url: http://127.0.0.1:8000/v1/chat/completions
  temperature: 0.0
  max_tokens: 512
  max_workers: 4
  request_timeout: 240
  request_retries: 3

audit:
  tau_l: 0.15
  tau_c: 0.60
  tau_h: 0.70
  embedding_leakage_threshold: 0.85
  embedder: labse
  embedding_dim: 768
